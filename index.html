  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

) saturate(180%); border:1px solid rgba(255,255,255,0.65); box-shadow:0 16px 48px rgba(16,46,90,0.20), inset 0 1px 0 rgba(255,255,255,0.85);\">\n      <div style=\"display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; background:rgba(0,58,112,0.10); border:1px solid rgba(0,58,112,0.14); font-size:11.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#0b3a6e;\">\n        <span style=\"width:7px; height:7px; border-radius:50%; background:#f9b500; box-shadow:0 0 0 3px rgba(249,181,0,0.25);\"><\u002Fspan>\n        Region X · Sulawesi &amp; Maluku\n      <\u002Fdiv>\n      <h1 style=\"margin:16px 0 6px; font-size:25px; font-weight:800; letter-spacing:-0.02em; line-height:1.15; color:#0a2a52;\">Form Partisipasi Pegawai<br>Livin' Food<\u002Fh1>\n      <p style=\"margin:0; font-size:13.5px; color:#3d5a80; font-weight:500;\">Lengkapi data berikut untuk mencatat partisipasi transaksi Anda.<\u002Fp>\n      <div style=\"height:4px; width:64px; margin:18px auto 0; border-radius:999px; background:linear-gradient(90deg,#003a70,#f9b500);\"><\u002Fdiv>\n    <\u002Fheader>\n\n    <form onsubmit=\"{{ onSubmit }}\" style=\"position:relative; padding:26px 22px 28px; border-radius:30px; background:linear-gradient(160deg, rgba(255,255,255,0.50), rgba(255,255,255,0.30)); -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%); border:1px solid rgba(255,255,255,0.60); box-shadow:0 20px 56px rgba(16,46,90,0.22), inset 0 1px 0 rgba(255,255,255,0.85);\">\n\n      <div style=\"margin-bottom:18px;\">\n        <label style=\"display:block; font-size:13px; font-weight:700; margin-bottom:7px; color:#0b3a6e; letter-spacing:0.01em;\">Area / Departemen <span style=\"color:#e0455e;\">*<\u002Fspan><\u002Flabel>\n        <select value=\"{{ area }}\" onchange=\"{{ onAreaChange }}\" style=\"width:100%; padding:13px 14px; border:1px solid rgba(255,255,255,0.55); border-radius:14px; font-size:15px; font-family:i >\n          <select value=\"{{ merchant }}\" onchange=\"{{ onMerchantChange }}\" style=\"width:100%; padding:13px 14px; border:1px solid rgba(255,255,255,0.55); border-radius:14px; font-size:15px; font-family:inherit; color:#0b2a4a; background:rgba(255,255,255,0.40); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); box-shadow:inset 0 1px 1px rgba(255,255,255,0.7), 0 1px 2px rgba(10,40,80,0.05); outline:none; appearance:none;\" style-focus=\"border-color:rgba(0,90,170,0.75); background:rgba(255,255,255,0.62); box-shadow:0 0 0 4px rgba(0,110,200,0.16), inset 0 1px 1px rgba(255,255,255,0.7);\">\n            <option value=\"\">-- Pilih Merchant --<\u002Foption>\n            <sc-for list=\"{{ merchantOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n              <option value=\"{{ opt }}\">{{ opt }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fselect>\n          <sc-if value=\"{{ err_merchant }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px; color:#e0455e; margin-top:6px; font-weight:600;\">Merchant wajib dipilih.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n      <sc-for list=\"{{ textFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"margin-bottom:18px;\">\n          <label style=\"display:block; font-size:13px; font-weight:700; margin-bottom:7px; color:#0b3a6e;\">{{ f.label }} <sc-if value=\"{{ f.req }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#e0455e;\">*<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ f.optText }}\" hint-placeholder-val=\"{{ false }}\"> <span style=\"color:#5a6b80; font-weight:400; font-size:12px;\">{{ f.optText }}<\u002Fspan><\u002Fsc-if><\u002Flabel>\n          <sc-if value=\"{{ f.isTextarea }}\" hint-placeholder-val=\"{{ false }}\">\n            <textarea value=\"{{ f.value }}\" onchange=\"{{ f.onChange }}\" placeholder=\"{{ f.placeholder }}\" style=\"{{ f.areaStyle }}\" style-focus=\"border-color:rgba(0,90,170,0.75); background:rgba(255,255,255,0.62); box-shadow:0 0 0 4px rgba(0,110,200,0.16), inset 0 1px 1px rgba(255,255,255,0.7);\"><\u002Ftextarea>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isInput }}\" hint-placeholder-val=\"{{ true }}\">\n            <input type=\"{{ f.type }}\" value=\"{{ f.value }}\" onchange=\"{{ f.onChange }}\" placeholder=\"{{ f.placeholder }}\" inputmode=\"{{ f.inputMode }}\" maxlength=\"{{ f.maxLength }}\" max=\"{{ f.max }}\" style=\"{{ f.inputStyle }}\" style-focus=\"border-color:rgba(0,90,170,0.75); background:rgba(255,255,255,0.62); box-shadow:0 0 0 4px rgba(0,110,200,0.16), inset 0 1px 1px rgba(255,255,255,0.7);\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.hasError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px; color:#e0455e; margin-top:6px; font-weight:600;\">{{ f.errMsg }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div style=\"margin-bottom:18px;\">\n        <label style=\"display:block; font-size:13px; font-weight:700; margin-bottom:7px; color:#0b3a6e;\">Bukti Screenshot <span style=\"color:#e0455e;\">*<\u002Fspan><\u002Flabel>\n\n        <div style=\"display:flex; gap:12px; align-items:center; padding:12px; margin-bottom:12px; border-radius:16px; background:rgba(255,255,255,0.30); border:1px solid rgba(255,255,255,0.5); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);\">\n          <img src=\"e72d8ad2-f992-4a23-b72b-112e566b7dbd\" alt=\"Contoh\" style=\"width:62px; height:88px; object-fit:cover; border-radius:10px; border:1px solid rgba(255,255,255,0.7); box-shadow:0 4px 12px rgba(16,46,90,0.18); flex:none;\">\n          <div style=\"font-size:12px; line-height:1.5; color:#3d5a80;\">Contoh: screenshot <b>riwayat transaksi Livin' Food<\u002Fb> — halaman <b>Histori<\u002Fb> dengan status <b>\"Selesai\"<\u002Fb>.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <label style=\"display:block; padding:20px 16px; text-align:center; border-radius:16px; border:1.5px dashed rgba(0,90,170,0.40); background:rgba(255,255,255,0.30); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); cursor:pointer; transition:border-color .2s, background .2s;\" style-hover=\"border-color:rgba(0,90,170,0.85); background:rgba(255,255,255,0.5);\">\n          <input type=\"file\" accept=\"image/*\" onchange=\"{{ onFile }}\" style=\"display:none;\">\n          <div style=\"font-size:14px; font-weight:600; color:#0b3a6e;\">{{ fileLabel }}<\u002Fdiv>\n          <div style=\"font-size:11.5px; color:#5a6b80; margin-top:4px;\">Format JPG / PNG · otomatis dikompres sebelum dikirim<\u002Fdiv>\n        <\u002Flabel>\n\n        <sc-if value=\"{{ shotPreview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px; text-align:center;\">\n            <img src=\"{{ shotPreview }}\" style=\"max-width:100%; max-height:240px; border-radius:14px; border:1px solid rgba(255,255,255,0.7); box-shadow:0 10px 28px rgba(16,46,90,0.20);\">\n            <div style=\"font-size:12px; color:#5a6b80; margin-top:7px; word-break:break-all;\">{{ shotName }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ err_shot }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px; color:#e0455e; margin-top:6px; font-weight:600;\">Screenshot bukti transaksi wajib diupload.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n\n      <button type=\"submit\" disabled=\"{{ submitting }}\" style=\"width:100%; margin-top:6px; padding:15px; border:none; border-radius:16px; font-family:inherit; font-size:15.5px; font-weight:700; letter-spacing:0.01em; color:#fff; cursor:pointer; background:linear-gradient(135deg,#0a4f9c,#003a70); box-shadow:0 10px 26px rgba(0,58,112,0.40), inset 0 1px 0 rgba(255,255,255,0.35); transition:transform .12s, box-shadow .2s;\" style-hover=\"box-shadow:0 14px 32px rgba(0,58,112,0.50), inset 0 1px 0 rgba(255,255,255,0.4);\" style-active=\"transform:translateY(1px);\">{{ submitLabel }}<\u002Fbutton>\n\n      <sc-if value=\"{{ status }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ statusStyle }}\">{{ statusMsg }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fform>\n\n    <footer style=\"text-align:center; font-size:11.5px; color:#3d5a80; margin-top:20px; font-weight:500;\">Copyright © 2026 Opik · Region X (Sulawesi &amp; Maluku)<\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    area: '', unit: '', cabang: '',\n    nama: '', nip: '', jabatan: '', hp: '', merchant: '', issue: '', tanggalTransaksi: '',\n    shot: { base64: '', mime: '', name: '', preview: '' },\n    errors: {},\n    submitting: false,\n    status: null\n  };\n\n  SCRIPT_URL = \"https://script.google.com/macros/s/AKfycbxFr2GqxZe0N3thy0zg0ymMRRmQmY8NMkoErrGHhVI_eqQ8rLkuTw0QuxloTP1wLa9Plg/exec\";\n\n  AREA_LIST = [\"Region\",\"Manado\",\"Palu\",\"Makassar Kartini\",\"Kendari Mesjid Agung\",\"Pare Pare\",\"Makassar Ratulangi\",\"Maluku\"];\n\n  UNITS = [\"Regional CEO & L3+\",\"Business Support\",\"Consumer Loan\",\"Credit Card\",\"Government Business\",\"Regional Business Control\",\"Regional Financial\",\"Regional Human Capital\",\"Regional Legal\",\"Retail Funding\",\"Personal Loan\",\"Transaction Banking Retail\",\"Transaction Banking Wholesale\",\"SME\",\"Wealth Business\",\"Retail Credit Operations\",\"Treasury Makassar\",\"Micro Bkg X\",\"Mortgage Auto Loan X\",\"Transaction Operations X\"];\n\n  MERCHANTS = [\"Konijiwa\",\"Coto Dg Tayang\",\"Darikopi\",\"Eksposed\",\"Mas Daeng\",\"KFC\"];\n\n  AREA_BRANCHES = {\n    \"Manado\": [[\"15000\",\"KC Manado Dotulolong Lasut\"],[\"15001\",\"KCP Manado Toar\"],[\"15002\",\"KC Kotamobagu\"],[\"15003\",\"KC Bitung\"],[\"15004\",\"KC Gorontalo\"],[\"15005\",\"KC Tahuna\"],[\"15006\",\"KCP Manado Sam Ratulangi\"],[\"15007\",\"KCP Manado Sudirman\"],[\"15008\",\"KCP Limboto\"],[\"15010\",\"KCP Manado Boulevard\"],[\"15011\",\"KCP Marisa\"],[\"15012\",\"KCP Tomohon\" ],[\"15237\",\"KCP Makassar Universitas Hasanuddin\"],[\"15238\",\"KCP Makassar Pelabuhan Indonesia\"],[\"15242\",\"KCP Makassar Pasar Sentral\"],[\"15243\",\"KCP Makassar Sombaopu\"],[\"15244\",\"KCP Pangkep Hasanuddin\"],[\"15245\",\"KCP Makassar Pusat Grosir Daya\"],[\"15246\",\"KCP Makassar Perintis Kemerdekaan\"],[\"15248\",\"KCP Maros Sudirman\"],[\"15249\",\"KCP Makassar Urip Sumoharjo\"],[\"15250\",\"KCP Makassar Monginsidi\"],[\"15251\",\"KCP Makassar CPI\"],[\"15252\",\"KCP Makassar Latimojong\"],[\"15269\",\"KCP Maros Camba\"],[\"15271\",\"KCP Makassar Pannampu\"],[\"15291\",\"KCP Makassar BTP\"],[\"15293\",\"KCP Makassar Paccerakkang\"],[\"15297\",\"KCP Makassar Sudiang\"]],\n    \"Kendari Mesjid Agung\": [[\"16200\",\"KC Kendari Mesjid Agung\"],[\"16201\",\"KCP Kendari Beach\"],[\"16202\",\"KCP Bau Bau\"],[\"16203\",\"KC Pomalaa\"],[\"16204\",\"KCP Kolaka\"],[\"16205\",\"KCP Wua Wua\"],[\"16206\",\"KCP Kolaka Utara\"],[\"16207\",\"KCP Kendari Bundaran Anduonohu\"],[\"16208\",\"KCP Kendari Lepo-Lepo\"],[\"16210\",\"KCP Morosi\"],[\"16275\",\"KCP Kendari Andunouhu\"],[\"16276\",\"KCP Tinanggea\"],[\"16277\",\"KCP Pasarwajo\"],[\"16278\",\"KCP Molawe\"],[\"16279\",\"KCP Raha\"],[\"16280\",\"KCP Bombana\"],[\"16281\",\"KCP Unaaha\"],[\"16282\",\"KCP Buton Lombe\"],[\"16283\",\"KCP Baubau Wolio\"],[\"16284\",\"KCP Rate Rate\"],[\"16285\",\"KCP Lapai (dh Lapaik)\"]],\n    \"Pare Pare\": [[\"17000\",\"KC Pare Pare\"],[\"17001\",\"KCP Pinrang\"],[\"17002\",\"KCP Polewali Mandar\"],[\"17003\",\"KCP Pare-Pare Pattompo\"],[\"17004\",\"KCP Mamuju\"],[\"17005\",\"KC Watampone\"],[\"17006\",\"KCP Sengkang\"],[\"17007\",\"KC Palopo\"],[\"17008\",\"KCP Rantepao\"],[\"17009\",\"KC Soroako\"],[\"17010\",\"KCP Sidrap Sudirman\"],[\"17011\",\"KCP Sinjai Pasar Sentral\"],[\"17015\",\"KCP Kahu\"],[\"17016\",\"KCP Majene\"],[\"17075\",\"KCP Topoyo\"],[\"17076\",\"KCP Sidrap\"],[\"17077\",\"KCP Siwa\"],[\"17078\",\"KCP Soppeng\"],[\"17079\",\"KCP Belopa\"],[\"17080\",\"KCP Masamba\"],[\"17082\",\"KCP Barru\"],[\"17083\",\"KCP Tomoni\"],[\"17084\",\"KCP Malili\"],[\"17085\",\"KCP Polewali Mandar Pekkabata\"],[\"17087\",\"KCP Toraja Makale\"],[\"17088\",\"KCP Enrekang Pasar Sudu\"],[\"17091\",\"KCP Bone Bone\"]],\n    \"Makassar Ratulangi\": [[\"17400\",\"KC Makassar Sam Ratulangi\"],[\"17401\",\"KCP Makassar Panakkukang\"],[\"17402\",\"KCP Makassar Hertasning\"],[\"17403\",\"KCP Sungguminasa\"],[\"17404\",\"KCP Makassar Cendrawasih\"],[\"17406\",\"KCP Makassar Toddopuli\"],[\"17407\",\"KCP Bulukumba\"],[\"17408\",\"KCP Makassar Pettarani\"],[\"17409\",\"KCP Makassar Veteran Selatan\"],[\"17410\",\"KCP Bantaeng Pahlawan\"],[\"17411\",\"KCP Jeneponto\"],[\"17451\",\"KCP Selayar\"],[\"17452\",\"KCP Gowa Malino\"],[\"17453\",\"KCP Bantaeng Tanetea\"],[\"17454\",\"KCP Takalar\"],[\"17455\",\"KCP Limbung\"],[\"17456\",\"KCP Hartaco\"],[\"17457\",\"KCP Antang\"],[\"17458\",\"KCP Gowa Pallangga\"],[\"17459\",\"KCP Gowa Balang - Balang\"],[\"17462\",\"KCP Bulukumba Tanete\"],[\"17463\",\"KCP Barombong\"]],\n    \"Maluku\": [[\"18600\",\"KC Ambon Pantai Mardika\"],[\"18601\",\"KC Ambon Pattimura\"],[\"18602\",\"KC Ternate\"],[\"18603\",\"KCP Ambon Paso\"],[\"18604\",\"KCP Ambon Masohi\"],[\"18605\",\"KCP Ambon Namlea\"],[\"18607\",\"KCP Maluku Tenggara\"],[\"18608\",\"KCP Ternate Pahlawan Revolusi\"],[\"18609\",\"KCP Buli\"],[\"18610\",\"KCP Tobelo\"],[\"18611\",\"KCP Sofifi\"],[\"18612\",\"KCP Ambon Universitas Pattimura\"],[\"18613\",\"KCP Indonesia Weda Bay Industrial Park\"],[\"18651\",\"KCP Bula\"],[\"18652\",\"KCP Gemba\"],[\"18654\",\"KCP Waeapo\"],[\"18655\",\"KCP Wayame\"],[\"18656\",\"KCP Saumlaki\"],[\"18657\",\"KCP Ternate Bastiong\"],[\"18658\",\"KCP Labuha\"],[\"18659\",\"KCP Weda\"],[\"18660\",\"KCP Jailolo\"],[\"18661\",\"KCP Obi\"]]\n  };\n\n  fieldStyle(hasError, textarea) {\n    const border = hasError ? 'rgba(224,69,94,0.85)' : 'rgba(255,255,255,0.55)';\n    const ring = hasError ? '0 0 0 4px rgba(224,69,94,0.14), ' : '';\n    return \"width:100%; padding:13px 14px; border:1px solid \" + border + \"; border-radius:14px; font-size:15px; font-family:inherit; color:#0b2a4a; background:rgba(255,255,255,0.40); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); box-shadow:\" + ring + \"inset 0 1px 1px rgba(255,255,255,0.7), 0 1px 2px rgba(10,40,80,0.05); outline:none;\" + (textarea ? \" min-height:74px; resize:vertical;\" : \"\");\n  }\n\n  setField(name, value) {\n    this.setState(s => ({ [name]: value, errors: { ...s.errors, [name]: false }, status: null }));\n  }\n\n  makeChange = (name) => (e) => {\n    let v = e.target.value;\n    if (name === 'nip') v = v.replace(/\\D/g, '').slice(0, 10);\n    if (name === 'hp') v = v.replace(/[^\\d+]/g, '').slice(0, 15);\n    this.setField(name, v);\n  };\n\n  onAreaChange = (e) => {\n    const area = e.target.value;\n    this.setState(s => ({ area, unit: '', cabang: '', errors: { ...s.errors, area: false, unit: false, cabang: false }, status: null }));\n  };\n  onUnitChange = (e) => this.setField('unit', e.target.value);\n  onCabangChange = (e) => this.setField('cabang', e.target.value);\n  onMerchantChange = (e) => this.setField('merchant', e.target.value);\n\n  onFile = (e) => {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    if (!file.type.startsWith('image/')) { alert('File harus berupa gambar (JPG/PNG).'); e.target.value = ''; return; }\n    const reader = new FileReader();\n    reader.onload = (ev) => {\n      const img = new Image();\n      img.onload = () => {\n        const MAX = 1280;\n        let w = img.width, h = img.height;\n        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * (MAX / w)); w = MAX; } else { w = Math.round(w * (MAX / h)); h = MAX; } }\n        const c = document.createElement('canvas');\n        c.width = w; c.height = h;\n        c.getContext('2d').drawImage(img, 0, 0, w, h);\n        const url = c.toDataURL('image/jpeg', 0.75);\n        this.setState(s => ({\n          shot: { base64: url.split(',')[1], mime: 'image/jpeg', name: (file.name || 'screenshot').replace(/\\.[^.]+$/, '') + '.jpg', preview: url },\n          errors: { ...s.errors, shot: false }, status: null\n        }));\n      };\n      img.src = ev.target.result;\n    };\n    reader.readAsDataURL(file);\n  };\n\n  validate() {\n    const s = this.state, e = {};\n    let ok = true;\n    if (!s.area) { e.area = true; ok = false; }\n    if (s.area === 'Region') { if (!s.unit) { e.unit = true; ok = false; } }\n    else if (s.area) { if (!s.cabang) { e.cabang = true; ok = false; } }\n    if (!s.nama.trim()) { e.nama = true; ok = false; }\n    if (!/^\\d{10}$/.test(s.nip.trim())) { e.nip = true; ok = false; }\n    if (!s.jabatan.trim()) { e.jabatan = true; ok = false; }\n    if (s.hp.replace(/\\D/g, '').length < 9) { e.hp = true; ok = false; }\n    if (!s.merchant.trim()) { e.merchant = true; ok = false; }\n    if (!s.tanggalTransaksi.trim()) { e.tanggalTransaksi = true; ok = false; }\n    if (!s.shot.base64) { e.shot = true; ok = false; }\n    this.setState({ errors: e });\n    return ok;\n  }\n\n  onSubmit = (e) => {\n    e.preventDefault();\n    if (!this.validate()) {\n      this.setState({ status: { type: 'error', msg: 'Mohon lengkapi semua field bertanda (*) dengan benar.' } });\n      return;\n    }\n    if (this.SCRIPT_URL.indexOf('PASTE_URL_WEB_APP') === 0) {\n      this.setState({ status: { type: 'error', msg: 'SCRIPT_URL belum diisi. Lihat README untuk cara deploy Apps Script.' } });\n      return;\n    }\n    const s = this.state;\n    const payload = {\n      area: s.area,\n      unit: s.area === 'Region' ? s.unit : '',\n      cabang: s.area !== 'Region' ? s.cabang : '',\n      nama: s.nama.trim(), nip: s.nip.trim(), jabatan: s.jabatan.trim(),\n      hp: s.hp.trim(), merchant: s.merchant.trim(), issue: s.issue.trim(),\n      tanggalTransaksi: s.tanggalTransaksi,\n      screenshotBase64: s.shot.base64, screenshotMimeType: s.shot.mime, screenshotFileName: s.shot.name\n    };\n    this.setState({ submitting: true, status: null });\n    fetch(this.SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })\n      .then(r => r.json())\n      .then(json => {\n        if (json.status === 'success') {\n          this.setState({\n            area: '', unit: '', cabang: '', nama: '', nip: '', jabatan: '', hp: '', merchant: '', issue: '', tanggalTransaksi: '',\n            shot: { base64: '', mime: '', name: '', preview: '' }, errors: {}, submitting: false,\n            status: { type: 'success', msg: 'Data berhasil dikirim. Terima kasih!' }\n          });\n        } else {\n          this.setState({ submitting: false, status: { type: 'error', msg: 'Gagal mengirim: ' + (json.message || 'Terjadi kesalahan.') } });\n        }\n      })\n      .catch(err => this.setState({ submitting: false, status: { type: 'error', msg: 'Gagal mengirim data. Periksa koneksi internet Anda dan coba lagi. (' + err.message + ')' } }));\n  };\n\n  renderVals() {\n    const s = this.state;\n    const e = s.errors || {};\n    const showUnit = s.area === 'Region';\n    const showCabang = !!s.area && s.area !== 'Region';\n    const maxDate = new Date().toISOString().split('T')[0];\n\n    const cabangOptions = showCabang\n      ? [...(this.AREA_BRANCHES[s.area] || []).map(b => b[0] + ' - ' + b[1]), 'Kantor Area ' + s.area + ' (Pegawai Non Cabang)']\n      : [];\n\n    const defs = [\n      { name: 'nama', label: 'Nama Pegawai', req: true, placeholder: 'Nama lengkap sesuai data kepegawaian', errMsg: 'Nama pegawai wajib diisi.' },\n      { name: 'nip', label: 'NIP', req: true, optText: '(10 digit angka)', placeholder: 'Contoh: 0123456789', inputMode: 'numeric', maxLength: 10, errMsg: 'NIP wajib diisi dan harus tepat 10 digit angka.' },\n      { name: 'jabatan', label: 'Jabatan', req: true, placeholder: 'Contoh: Branch Manager / Frontliner', errMsg: 'Jabatan wajib diisi.' },\n      { name: 'hp', label: 'No. HP', req: true, type: 'tel', inputMode: 'numeric', maxLength: 15, placeholder: 'Contoh: 081234567890', errMsg: 'No. HP wajib diisi (minimal 9 digit).' },      { name: 'issue', label: 'Issue / Kendala', optText: '(jika ada)', type: 'textarea', placeholder: 'Kosongkan jika tidak ada kendala' },\n      { name: 'tanggalTransaksi', label: 'Tanggal Transaksi', req: true, type: 'date', max: maxDate, errMsg: 'Tanggal transaksi wajib diisi.' }\n    ];\n\n    const textFields = defs.map(d => {\n      const isTextarea = d.type === 'textarea';\n      const hasError = !!e[d.name];\n      return {\n        ...d,\n        req: !!d.req,\n        optText: d.optText || '',\n        type: d.type || 'text',\n        inputMode: d.inputMode || '',\n        maxLength: d.maxLength || undefined,\n        max: d.max || undefined,\n        value: s[d.name],\n        onChange: this.makeChange(d.name),\n        isTextarea,\n        isInput: !isTextarea,\n        hasError,\n        errMsg: d.errMsg || '',\n        inputStyle: this.fieldStyle(hasError, false),\n        areaStyle: this.fieldStyle(hasError, true)\n      };\n    });\n\n    const statusStyle = s.status\n      ? 'margin-top:16px; padding:13px 15px; border-radius:14px; font-size:13.5px; font-weight:600; border:1px solid ' +\n        (s.status.type === 'success' ? 'rgba(30,142,62,0.30); background:rgba(30,142,62,0.12); color:#0f6b2c;' : 'rgba(224,69,94,0.30); background:rgba(224,69,94,0.12); color:#b32338;')\n      : '';\n\n    return {\n      area: s.area, unit: s.unit, cabang: s.cabang,\n      areaOptions: this.AREA_LIST, unitOptions: this.UNITS, cabangOptions,\n      showUnit, showCabang,\n      err_area: !!e.area, err_unit: !!e.unit, err_cabang: !!e.cabang, err_shot: !!e.shot,\n      textFields,\n      onAreaChange: this.onAreaChange, onUnitChange: this.onUnitChange, onCabangChange: this.onCabangChange, onMerchantChange: this.onMerchantChange,\n      merchantOptions: this.MERCHANTS, err_merchant: !!e.merchant,\n      onFile:
